<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回合制文字游戏 - 正式版2.2</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131820; --border: #232a36; --text: #e6edf3;
    --muted: #8b98a9; --accent: #3ddc97; --danger: #ff6b6b; --blue: #4d9fff;
    --gold: #ffb454; --purple: #c792ea; --code: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif;
    height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  .game-container {
    width: 100%; max-width: 1000px; height: 95vh; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; position: relative;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #171d27; border-bottom: 1px solid var(--border);
    padding: 10px 20px; flex-wrap: wrap; gap: 10px;
  }
  .status-info {
    display: flex; gap: 15px; font-size: 13px; font-weight: bold; font-family: var(--code); flex-wrap: wrap;
  }
  .status-item span { color: var(--accent); margin-left: 5px; }
  .status-item.buff span { color: var(--purple); }
  .status-item.bank span { color: var(--gold); }
  .settings-area { display: flex; gap: 10px; }
  .btn-mini {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 12px; transition: 0.2s;
  }
  .btn-mini:hover { background: rgba(255,255,255,0.05); }
  .btn-mini:disabled { opacity: 0.4; cursor: not-allowed; }
  .main-area { display: flex; flex: 1; overflow: hidden; }
  .battle-stage {
    width: 350px; background: #080b10; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-around; align-items: center;
    padding: 20px; position: relative;
  }
  .char-box { display: flex; flex-direction: column; align-items: center; width: 100%; transition: transform 0.1s; }
  .char-emoji { font-size: 80px; line-height: 1; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
  .char-name { margin-top: 10px; font-weight: bold; font-size: 15px; font-family: var(--code); }
  .hp-bar-container {
    width: 80%; height: 12px; background: #333; border-radius: 6px; margin-top: 8px; overflow: hidden; border: 1px solid #444;
  }
  .hp-bar { height: 100%; background: var(--danger); transition: width 0.3s ease; }
  .hp-text { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--code); }
  .status-icons { display: flex; gap: 4px; margin-top: 4px; min-height: 20px; justify-content: center; flex-wrap: wrap; }
  .status-icon {
    font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.08);
    font-family: var(--code); font-weight: bold;
  }
  .status-icon.poison { color: #7fff7f; }
  .status-icon.burn { color: #ff9944; }
  .status-icon.stun { color: #ffdd55; }
  .status-icon.shield { color: #66ccff; }
  .affix-tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: rgba(255,107,107,0.2); color: var(--danger); margin: 0 2px; font-weight: bold;
  }
  @keyframes idle-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes idle-bounce { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-20px) scaleY(0.9); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  @keyframes flash-red { 0% { filter: brightness(1); } 50% { filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(5); } 100% { filter: brightness(1); } }
  .anim-float { animation: idle-float 3s ease-in-out infinite; }
  .anim-bounce { animation: idle-bounce 1.5s ease-in-out infinite; }
  .anim-hit { animation: shake 0.3s, flash-red 0.3s; }
  .vs-text { font-size: 24px; font-weight: 900; color: #333; font-style: italic; margin: 10px 0; }
  .damage-text {
    position: absolute; font-size: 24px; font-weight: 900; color: var(--danger);
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; animation: floatUp 0.8s ease-out forwards;
  }
  .damage-text.crit { font-size: 32px; color: var(--gold); animation: floatUpCrit 0.8s ease-out forwards; }
  .heal-text {
    position: absolute; font-size: 20px; font-weight: 900; color: var(--accent);
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; animation: floatUp 0.8s ease-out forwards;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } }
  @keyframes floatUpCrit { 0% { opacity: 1; transform: translateY(0) scale(1.5); } 100% { opacity: 0; transform: translateY(-70px) scale(1.8); } }
  .console {
    flex: 1; padding: 20px; overflow-y: auto; font-family: var(--code);
    font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; gap: 4px;
    background: var(--panel);
  }
  .console::-webkit-scrollbar { width: 8px; }
  .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .log-sys { color: var(--muted); }
  .log-atk { color: var(--blue); font-weight: bold; }
  .log-dmg { color: var(--danger); font-weight: bold; }
  .log-heal { color: var(--accent); font-weight: bold; }
  .log-reward { color: var(--gold); font-weight: bold; }
  .log-crit { color: var(--gold); font-weight: bold; font-size: 16px; text-shadow: 0 0 5px var(--gold); }
  .actions {
    padding: 15px 20px; background: #171d27; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 10px; min-height: 80px; align-items: center;
  }
  .btn {
    padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 14px; font-weight: bold;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--muted); }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
  .btn.primary:hover { background: #4ee8a5; }
  .btn.danger { background: rgba(255,107,107,0.15); border-color: var(--danger); color: var(--danger); }
  .btn.purple { background: rgba(199,146,234,0.15); border-color: var(--purple); color: var(--purple); }
  .btn.gold { background: rgba(255,180,84,0.15); border-color: var(--gold); color: var(--gold); }
  .btn.blue { background: rgba(77,159,255,0.15); border-color: var(--blue); color: var(--blue); }
  .modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(4px);
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .modal h3 { margin-bottom: 15px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-btn {
    padding: 10px; text-align: left; background: #171d27; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); cursor: pointer; font-family: var(--code); font-size: 13px;
  }
  .item-btn:hover { border-color: var(--blue); }
  /* 存档管理 */
  .save-item {
    display: flex; align-items: center; gap: 8px;
    background: #171d27; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .save-item .save-name { font-weight: bold; word-break: break-all; }
  .save-item .save-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .save-item .save-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .lottery-grid-wrap { 
    flex: 1; overflow-y: auto; padding: 10px; 
    background: rgba(0,0,0,0.2); border-radius: 8px;
    min-height: 200px; max-height: 50vh;
  }
  .lottery-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: flex-start; }
  .lottery-card {
    background: #171d27; border: 2px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100px; height: 130px; text-align: center; font-size: 12px; font-weight: bold;
    flex-shrink: 0; opacity: 0; transform: scale(0.5);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .lottery-card.show { opacity: 1; transform: scale(1); }
  .lottery-card .icon { font-size: 30px; margin-bottom: 5px; }
  .lottery-card .name { color: #fff; line-height: 1.2; }
  .lottery-card .desc { color: var(--muted); font-size: 10px; margin-top: 4px; }
  .lottery-card.common { border-color: var(--muted); }
  .lottery-card.rare { border-color: var(--blue); box-shadow: 0 0 10px rgba(77,159,255,0.3); }
  .lottery-card.epic { border-color: var(--purple); box-shadow: 0 0 15px rgba(199,146,234,0.4); background: rgba(199,146,234,0.05); }
  .lottery-card.legendary { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,180,84,0.5); background: rgba(255,180,84,0.1); }
  .lottery-actions { display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border); padding-top: 15px; margin-top: 10px; flex-wrap: wrap; }
  .pity-info { text-align: center; color: var(--muted); font-size: 12px; font-family: var(--code); padding: 6px 0; }
  .equip-slot {
    flex: 1; background: #171d27; border: 2px dashed var(--border); border-radius: 8px;
    padding: 12px; text-align: center; min-height: 110px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s;
  }
  .equip-slot.filled { border-style: solid; }
  .equip-slot:hover { border-color: var(--blue); }
  .equip-slot .slot-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .equip-slot .eq-name { font-weight: bold; font-size: 14px; }
  .equip-slot .eq-stats { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .rarity-common { color: var(--muted); }
  .rarity-rare { color: var(--blue); }
  .rarity-epic { color: var(--purple); }
  .rarity-legendary { color: var(--gold); }
  .talent-node {
    background: #171d27; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; margin-bottom: 8px; font-size: 12px;
  }
  .talent-node .btn-mini { margin-top: 6px; width: 100%; }
  .quest-card {
    background: #171d27; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
  }
  .quest-progress { height: 6px; background: #333; border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .quest-progress-bar { height: 100%; background: var(--accent); transition: width 0.3s; }
  .ach-card {
    background: #171d27; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-bottom: 8px; opacity: 0.5;
  }
  .ach-card.unlocked { opacity: 1; border-color: var(--gold); }
  .tab-bar { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    padding: 8px 16px; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font-weight: bold; font-size: 13px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  @keyframes borderGlow {
    0% { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
    50% { border-color: #fff; box-shadow: 0 0 30px var(--gold), inset 0 0 20px var(--gold); }
    100% { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  }
  .victory-content {
    animation: borderGlow 2s infinite; border-width: 2px !important;
    background: linear-gradient(135deg, #131820 0%, #2a2418 100%) !important;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="top-bar">
    <div class="status-info">
      <div class="status-item">血量: <span id="ui-hp">300/300</span></div>
      <div class="status-item">金币: <span id="ui-gold">400</span></div>
      <div class="status-item bank">存款: <span id="ui-bank">0</span></div>
      <div class="status-item">等级: <span id="ui-lvl">0</span></div>
      <div class="status-item">技能点: <span id="ui-sp">50</span></div>
      <div class="status-item buff">强化: <span id="ui-weapon">+0</span></div>
      <div class="status-item buff">陨铁: <span id="ui-iron">0</span></div>
    </div>
    <div class="settings-area">
      <button class="btn-mini" id="btnSpeed">速度: 快</button>
    </div>
  </div>
  <div class="main-area">
    <div class="battle-stage" id="battleStage">
      <div class="char-box" id="playerBox">
        <div class="char-emoji" style="font-size:70px;">🧑‍💻</div>
        <div class="char-name">你 (Lv <span id="stage-player-lvl">0</span>)</div>
        <div class="hp-bar-container"><div class="hp-bar" id="stage-player-hp-bar" style="width:100%; background:var(--accent);"></div></div>
        <div class="hp-text" id="stage-player-hp-text">300 / 300</div>
        <div class="status-icons" id="playerStatusIcons"></div>
      </div>
      <div class="vs-text" id="vsText">VS</div>
      <div class="char-box" id="enemyBox" style="display: none;">
        <div class="char-emoji anim-float" id="enemyEmoji">👾</div>
        <div class="char-name" id="stage-enemy-name">怪物</div>
        <div class="hp-bar-container"><div class="hp-bar" id="stage-enemy-hp-bar" style="width:100%;"></div></div>
        <div class="hp-text" id="stage-enemy-hp-text">0 / 0</div>
        <div class="status-icons" id="enemyStatusIcons"></div>
        <div class="status-icons" id="enemyAffixIcons"></div>
      </div>
    </div>
    <div class="console" id="console"></div>
  </div>
  <div class="actions" id="actions"></div>
</div>

<!-- 背包 -->
<div class="modal" id="bagModal">
  <div class="modal-content">
    <h3>背包</h3>
    <div class="item-grid" id="bagList"></div>
    <button class="btn" style="margin-top: 20px; width: 100%;" onclick="closeBag()">关闭</button>
  </div>
</div>

<!-- 抽奖 -->
<div class="modal" id="lotteryModal">
  <div class="modal-content" style="max-width: 650px;">
    <h3>🎰 幸运抽奖</h3>
    <div class="pity-info" id="pityInfo"></div>
    <div class="lottery-grid-wrap" id="lotteryGridWrap">
      <div class="lottery-grid" id="lotteryGrid">
        <div style="text-align: center; color: var(--muted); padding: 40px 0; width:100%;">点击下方按钮开始抽奖</div>
      </div>
    </div>
    <div class="lottery-actions">
      <button class="btn primary" id="btnDraw1" onclick="drawLottery(1)">单抽 (40 金币)</button>
      <button class="btn gold" id="btnDraw10" onclick="drawLottery(10)">十连抽 (350 金币)</button>
      <button class="btn" onclick="closeLotteryModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 装备 -->
<div class="modal" id="equipModal">
  <div class="modal-content" style="max-width: 720px;">
    <h3>⚔️ 装备</h3>
    <div id="equipSlots" style="display:flex;gap:10px;margin-bottom:15px;"></div>
    <h4 style="margin-bottom:8px;font-size:13px;">仓库 <span id="equipBagCount" style="color:var(--muted);"></span></h4>
    <div id="equipBagList" style="max-height:280px;overflow-y:auto;"></div>
    <button class="btn" style="margin-top:15px;" onclick="closeEquipPanel()">关闭</button>
  </div>
</div>

<!-- 天赋树 -->
<div class="modal" id="talentModal">
  <div class="modal-content" style="max-width: 780px;">
    <h3>🌳 天赋树 <span style="color: var(--purple); font-size: 14px;">剩余: <span id="talentPointsDisplay">0</span> 点</span></h3>
    <div id="talentGrid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;"></div>
    <button class="btn" style="margin-top: 15px;" onclick="closeTalentTree()">关闭</button>
  </div>
</div>

<!-- 任务板 -->
<div class="modal" id="questModal">
  <div class="modal-content" style="max-width: 650px;">
    <h3>📜 悬赏任务板</h3>
    <div id="questList"></div>
    <button class="btn" style="margin-top: 15px;" onclick="closeQuestBoard()">关闭</button>
  </div>
</div>

<!-- 成就/图鉴 -->
<div class="modal" id="achModal">
  <div class="modal-content" style="max-width: 700px;">
    <h3>🏅 成就 & 图鉴</h3>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabAch" onclick="switchAchTab('ach')">成就</button>
      <button class="tab-btn" id="tabMonster" onclick="switchAchTab('monster')">怪物图鉴</button>
      <button class="tab-btn" id="tabItem" onclick="switchAchTab('item')">物品图鉴</button>
    </div>
    <div id="achContent" style="max-height:420px;overflow-y:auto;"></div>
    <button class="btn" style="margin-top: 15px;" onclick="closeAchievementPanel()">关闭</button>
  </div>
</div>

<!-- 存档管理 -->
<div class="modal" id="saveModal">
  <div class="modal-content" style="max-width: 560px;">
    <h3>💾 存档管理</h3>
    <div id="saveList" style="max-height: 50vh; overflow-y: auto;"></div>
    <button class="btn" style="margin-top: 15px;" onclick="closeSaveManager()">关闭</button>
  </div>
</div>

<!-- 通关 -->
<div class="modal" id="victoryModal">
  <div class="modal-content victory-content" style="max-width: 600px; text-align: center; color: #fff;">
    <h1 style="color: var(--gold); font-size: 45px; margin-bottom: 20px; text-shadow: 0 0 30px var(--gold); font-family: serif;">VICTORY</h1>
    <div style="font-size: 50px; margin-bottom: 10px;">👑</div>
    <p style="font-size: 16px; line-height: 1.8; color: #eee; margin-bottom: 25px;">
      你击败了深渊第 20 层的终极领主！<br>
      笼罩在城镇上空的阴霾终于散去，你成为了传说中的英雄。<br>
      <span style="color: var(--gold); font-weight: bold;">（你的冒险将被吟游诗人永远传唱）</span>
    </p>
    <div style="display: flex; justify-content: center; gap: 15px;">
      <button class="btn gold" onclick="continueEndless()">继续无尽挑战</button>
      <button class="btn" onclick="showMainMenu(); closeModal('victoryModal')">回到主菜单</button>
    </div>
  </div>
</div>

<script>
// ==================== 音效 ====================
const SFX = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(type) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const tone = (f, d, t, v, fe=null) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = t; o.frequency.setValueAtTime(f, now);
      if (fe) o.frequency.exponentialRampToValueAtTime(fe, now+d);
      g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.01, now+d);
      o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now+d);
    };
    const noise = (d, ft, f, v) => {
      const bs = this.ctx.sampleRate * d;
      const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i=0;i<bs;i++) data[i] = Math.random()*2-1;
      const n = this.ctx.createBufferSource(); n.buffer = buf;
      const fl = this.ctx.createBiquadFilter(); fl.type=ft; fl.frequency.setValueAtTime(f,now);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(v,now); g.gain.exponentialRampToValueAtTime(0.01,now+d);
      n.connect(fl); fl.connect(g); g.connect(this.ctx.destination); n.start(now);
    };
    switch(type) {
      case 'click': tone(600,0.05,'sine',0.05); break;
      case 'swing': noise(0.15,'bandpass',2000,0.1); break;
      case 'hit': tone(150,0.1,'square',0.1,50); noise(0.1,'lowpass',400,0.15); break;
      case 'crit': tone(400,0.3,'sawtooth',0.15,100); noise(0.2,'highpass',1500,0.2); break;
      case 'hurt': tone(100,0.2,'triangle',0.2,40); break;
      case 'heal': tone(523.25,0.1,'sine',0.1); setTimeout(()=>tone(659.25,0.2,'sine',0.1),100); break;

function addStatus(arr, type, value, turns) {
  const ex = arr.find(s=>s.type===type);
  if (type==='shield') {
    if (ex) ex.value += value; else arr.push({type,value,turns:99});
    return;
  }
  if (ex) {
    ex.turns = Math.max(ex.turns, turns);
    if (type==='burn') ex.value = Math.max(ex.value, value);
    return;
  }
  arr.push({type,value,turns});
}
function absorbShield(arr, dmg) {
  const s = arr.find(x=>x.type==='shield');
  if (!s) return dmg;
  const a = Math.min(s.value, dmg);
  s.value -= a;
  if (s.value<=0) { arr.splice(arr.indexOf(s),1); log('护盾破碎！','sys'); }
  return dmg - a;
}
function tickDot(arr, maxHp) {
  let total=0, p=false, b=false;
  for (let i=arr.length-1;i>=0;i--) {
    const s=arr[i]; let d=0;
    if (s.type==='poison') { d=Math.max(1,Math.floor(maxHp*0.03)); p=true; }
    else if (s.type==='burn') { d=s.value; b=true; }
    if (d>0) { total+=d; s.turns--; if (s.turns<=0) arr.splice(i,1); }
  }
  if (p) SFX.play('poison');
  if (b) SFX.play('burn');
  return total;
}

function generateEquip(slot, rarity, level) {
  level = Math.max(1, level||1);
  const mult = RARITY_MULT[rarity];
  const bases = {
    weapon: { atk: Math.round((6+level*2)*mult) },
    armor: { def: Math.round((3+level*1.2)*mult), hp: Math.round((20+level*10)*mult) },
    ring: { crit: +(0.02+level*0.004).toFixed(3) }
  };
  const stats = Object.assign({}, bases[slot]);
  for (const k in stats) stats[k] = Math.round(stats[k]*mult*10)/10;
  const subCount = { common:0, rare:1, epic:2, legendary:3 }[rarity];
  const pool = ['atk','def','hp','crit','lifesteal','spRegen','goldBonus'];
  for (let i=0;i<subCount;i++) {
    const k = pool[Math.floor(Math.random()*pool.length)];
    if (k in stats) continue;
    let v;
    switch(k) {
      case 'atk': v = Math.round((2+level)*mult); break;
      case 'def': v = Math.round((1+level*0.5)*mult); break;
      case 'hp': v = Math.round((10+level*5)*mult); break;
      case 'crit': v = +(0.01*mult).toFixed(3); break;
      case 'lifesteal': v = +(0.005*mult).toFixed(3); break;
      case 'spRegen': v = Math.round(2*mult); break;
      case 'goldBonus': v = +(0.05*mult).toFixed(3); break;
    }
    stats[k] = v;
  }
  const names = {
    weapon: ['铁剑','钢刃','暗影匕首','龙牙巨剑'],
    armor: ['皮甲','锁子甲','板甲','龙鳞战铠'],
    ring: ['铜戒','银环','秘银指环','星辉之戒']
  };
  const idx = RARITY_ORDER.indexOf(rarity);
  return {
    id: 'eq_'+Date.now()+'_'+Math.floor(Math.random()*9999),
    name: names[slot][idx],
    slot, rarity, stats
  };
}
function getEquipStats() {
  const s = { atk:0, def:0, hp:0, crit:0, lifesteal:0, spRegen:0, goldBonus:0 };
  for (const slot in STATE.equipment) {
    const eq = STATE.equipment[slot];
    if (!eq) continue;
    for (const k in eq.stats) s[k] += eq.stats[k];
  }
  const t = STATE.talentTree;
  s.atk += (t.atk||0)*2;
  s.crit += (t.crit||0)*0.02;
  s.lifesteal += (t.lifesteal||0)*0.01;
  s.crit += STATE.critRate;
  s.lifesteal += STATE.lifesteal;
  return s;
}
function getCritMultiplier() { return 2 + (STATE.talentTree.critDmg||0)*0.15; }
function getPlayerDamageReduction() {
  const eq = getEquipStats();
  let r = eq.def * 0.005 + (STATE.talentTree.def||0)*0.02;
  return Math.min(0.6, r);
}
function equipFromBag(idx) {
  const eq = STATE.equipBag[idx];
  if (!eq) return;
  const old = STATE.equipment[eq.slot];
  STATE.equipment[eq.slot] = eq;
  STATE.equipBag.splice(idx,1);
  if (old) STATE.equipBag.push(old);
  SFX.play('equip');
  log(`装备了 [${eq.name}]`, 'heal');
  updateUI();

}
function unequipSlot(slot) {

  if (!eq) return;
  if (STATE.equipBag.length >= 30) { log('仓库已满，无法卸下装备','dmg'); return; }
  STATE.equipment[slot] = null;
  STATE.equipBag.push(eq);

  log(`卸下了 [${eq.name}]`, 'sys');
  updateUI();
  openEquipPanel();
}
function formatEqStats(stats) {
  const parts = [];
  for (const k in stats) {
    const v = stats[k];
    if (k==='crit'||k==='lifesteal'||k==='goldBonus') parts.push(`${STAT_NAMES[k]}+${(v*100).toFixed(1)}%`);
    else parts.push(`${STAT_NAMES[k]}+${v}`);
  }
  return parts.join(' ');
}

function generateQuest() {
  const t = QUEST_TEMPLATES[Math.floor(Math.random()*QUEST_TEMPLATES.length)];
  const tier = Math.floor(Math.random()*3);
  return {
    id: 'q_'+Date.now()+Math.floor(Math.random()*9999),
    type: t.type,
    name: t.name.replace('{n}', t.targets[tier]),
    target: t.targets[tier],
    progress: 0,
    reward: { gold:t.gold[tier], talent:t.talent[tier], iron:t.iron[tier] },
    claimed: false
  };
}
function initQuests() {
  STATE.quests = [];
  for (let i=0;i<3;i++) STATE.quests.push(generateQuest());
}
function updateQuestProgress(type, value) {
  let changed = false;
  for (const q of STATE.quests) {
    if (q.claimed) continue;
    if (q.type !== type) continue;
    let np = q.progress;
    if (type==='kill') np = Math.min(q.target, q.progress + 1);
    else if (type==='damage') np = Math.min(q.target, q.progress + value);
    else np = Math.min(q.target, value);
    if (np !== q.progress) { q.progress = np; changed = true; }
  }
  return changed;
}
function claimQuest(idx) {
  const q = STATE.quests[idx];
  if (!q || q.claimed || q.progress < q.target) return;
  q.claimed = true;
  STATE.gold += q.reward.gold;
  STATE.talentPoints += q.reward.talent;
  STATE.ironOre += q.reward.iron;
  SFX.play('coin');
  log(`📜 任务完成：${q.name}，获得 ${q.reward.gold} 金币、${q.reward.talent} 天赋点、${q.reward.iron} 陨铁。`, 'reward');
  STATE.quests[idx] = generateQuest();
  updateUI();
  renderQuestBoard();
  checkAchievements();
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
        <div style="font-size:11px;color:var(--gold);">奖励：${q.reward.gold}G${q.reward.talent?` +${q.reward.talent}天赋`:''}${q.reward.iron?` +${q.reward.iron}陨铁`:''}</div>

// ==================== 抽奖 ====================
let isDrawing = false;
let rafId = 0;
let drawTimeoutId = 0;
const lotteryCardPool = [];
let drawAnimInterval = 80;

function initLotteryPool() {
  while (lotteryCardPool.length<10) {
    const div = document.createElement('div');
    div.className = 'lottery-card';
    div.innerHTML = `<div class="icon"></div><div class="name"></div><div class="desc"></div>`;
    div.style.display = 'none';
    div.dataset.released = '1';
    lotteryCardPool.push(div);
  }
}
function acquireLotteryCard() {
  let el;
  if (lotteryCardPool.length>0) el = lotteryCardPool.shift();
  else {
    el = document.createElement('div');
    el.className = 'lottery-card';
    el.innerHTML = `<div class="icon"></div><div class="name"></div><div class="desc"></div>`;
    el.style.display = 'none';
  }
  el.dataset.released = '0';
  return el;
}
function releaseLotteryCard(el) {
  if (!el || el.dataset.released==='1') return;
  el.dataset.released = '1';
  el.style.display = 'none';
  el.classList.remove('show','common','rare','epic','legendary');
  el.querySelector('.icon').textContent = '';
  el.querySelector('.name').textContent = '';
  el.querySelector('.desc').textContent = '';
  lotteryCardPool.push(el);
}
function updatePityInfo() {
  const el = document.getElementById('pityInfo');
  if (!el) return;
  if (STATE.pity>=9) el.textContent = '✨ 下一抽必定史诗及以上！';
  else el.textContent = `保底进度：${STATE.pity} / 9（再抽 ${10-STATE.pity} 次必出史诗）`;
}
function showLotteryPanel() {
  if (rafId) { cancelAnimationFrame(rafId); rafId=0; }
  if (drawTimeoutId) { clearTimeout(drawTimeoutId); drawTimeoutId=0; }
  isDrawing = false;
  document.getElementById('btnDraw1').disabled = false;
  document.getElementById('btnDraw10').disabled = false;
  const grid = document.getElementById('lotteryGrid');
  Array.from(grid.querySelectorAll('.lottery-card')).forEach(releaseLotteryCard);
  grid.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;width:100%;">点击下方按钮开始抽奖</div>';
  document.getElementById('lotteryGridWrap').scrollTop = 0;
  updatePityInfo();
  document.getElementById('lotteryModal').classList.add('show');
}
function closeLotteryModal() {
  closeModal('lotteryModal');
  if (rafId) { cancelAnimationFrame(rafId); rafId=0; }
  if (drawTimeoutId) { clearTimeout(drawTimeoutId); drawTimeoutId=0; }
  isDrawing = false;
  document.getElementById('btnDraw1').disabled = false;
  document.getElementById('btnDraw10').disabled = false;
  const grid = document.getElementById('lotteryGrid');
  Array.from(grid.querySelectorAll('.lottery-card')).forEach(releaseLotteryCard);
  grid.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;width:100%;">点击下方按钮开始抽奖</div>';
  openCity();
}
function drawLottery(count) {
  if (isDrawing) return;
  const cost = count===1?40:350;
  if (STATE.gold<cost) { log('金币不够！','dmg'); return; }
  isDrawing = true;
  const btn1 = document.getElementById('btnDraw1');
  const btn10 = document.getElementById('btnDraw10');
  btn1.disabled = btn10.disabled = true;
  STATE.gold -= cost;
  updateUI();
  SFX.play('gacha');
  const grid = document.getElementById('lotteryGrid');
  Array.from(grid.querySelectorAll('.lottery-card')).forEach(releaseLotteryCard);
  grid.innerHTML = '';
  document.getElementById('lotteryGridWrap').scrollTop = 0;
  const results = [];
  for (let i=0;i<count;i++) {
    const isLast = i===count-1;
    const force = isLast && count===10 && !results.some(r=>r.rarity==='epic'||r.rarity==='legendary');
    results.push(pullGacha(force));
  }
  updatePityInfo();
  const cardList = [];
  for (const res of results) {
    const card = acquireLotteryCard();
    card.className = `lottery-card ${res.rarity}`;
    card.querySelector('.icon').textContent = res.icon;
    card.querySelector('.name').textContent = res.name;
    card.querySelector('.desc').textContent = res.desc;
    card.style.display = 'none';
    card.classList.remove('show');
    grid.appendChild(card);
    cardList.push({el:card,res});
  }
  let currentIdx = 0, lastStamp = 0;
  function animate(ts) {
    if (!isDrawing) return;
    if (currentIdx>=count) {
      isDrawing = false;
      btn1.disabled = btn10.disabled = false;
      if (drawTimeoutId) { clearTimeout(drawTimeoutId); drawTimeoutId=0; }
      return;
    }
    if (ts-lastStamp>drawAnimInterval) {
      const item = cardList[currentIdx];
      item.el.style.display = 'flex';
      item.el.classList.add('show');
      if (item.res.rarity==='epic'||item.res.rarity==='legendary') SFX.play('crit');
      else if (currentIdx===0) SFX.play('coin');
      currentIdx++; lastStamp = ts;
    }
    rafId = requestAnimationFrame(animate);
  }
  rafId = requestAnimationFrame(animate);
  if (drawTimeoutId) clearTimeout(drawTimeoutId);
  drawTimeoutId = setTimeout(()=>{
    drawTimeoutId = 0;
    if (isDrawing) {
      cancelAnimationFrame(rafId);
      isDrawing = false;
      btn1.disabled = btn10.disabled = false;
      cardList.forEach(c=>{c.el.style.display='flex';c.el.classList.add('show');});
    }
  }, 3000);
}
function pullGacha(forceEpic=false) {
  const pity = STATE.pity>=9;
  let x;
  if (forceEpic||pity) x = 4+Math.floor(Math.random()*4);
  else x = Math.floor(Math.random()*13)+1;
  let res = { icon:'❓', name:'未知', desc:'', rarity:'common' };
  if (x===1) {
    if (addItem(ITEMS.HEAL)) res={icon:'🧪',name:'回复药',desc:'背包物品',rarity:'common'};
    else { STATE.gold+=15; res={icon:'🪙',name:'15 金币',desc:'背包已满补偿',rarity:'common'}; }
  } else if (x===2) {
    if (addItem(ITEMS.ATTACK)) res={icon:'🔥',name:'攻击药水',desc:'背包物品',rarity:'common'};
    else { STATE.gold+=60; res={icon:'🪙',name:'60 金币',desc:'背包已满补偿',rarity:'common'}; }
  } else if (x===3) {
    STATE.maxHp+=40; STATE.hp+=40;
    res={icon:'⛲',name:'生命之泉',desc:'血量上限+40',rarity:'legendary'};
    STATE.stats.legendaryPulled = (STATE.stats.legendaryPulled||0)+1;
  } else if (x>=4&&x<=7) {
    const sk = x-3;
    const skNames = {1:'蓄力一击',2:'回击',3:'逃跑',4:'吸血'};
    if (STATE.skills[sk]) {
      STATE.skillLv[sk] = Math.min(10, STATE.skillLv[sk]+2);
      res={icon:'📖',name:`[${skNames[sk]}]`,desc:'技能等级+2',rarity:'epic'};
    } else {
      STATE.skills[sk] = 1;
      if (!addItem(100+sk)) STATE.gold+=100;
      res={icon:'📖',name:`[${skNames[sk]}]`,desc:'解锁新技能',rarity:'epic'};
    }
  } else if (x===8) {
    const g = (Math.floor(Math.random()*8)+6)*5;
    STATE.gold+=g;
    res={icon:'🪙',name:`${g} 金币`,desc:'天降横财',rarity:'common'};
  } else if (x===9) {
    STATE.hp = Math.min(STATE.maxHp, STATE.hp+20);
    res={icon:'💖',name:'治疗术',desc:'恢复20点血量',rarity:'common'};
  } else if (x===10) {
    if (addItem(ITEMS.PILL)) res={icon:'💊',name:'技能药片',desc:'背包物品',rarity:'common'};
    else { STATE.gold+=45; res={icon:'🪙',name:'45 金币',desc:'背包已满补偿',rarity:'common'}; }
  } else if (x===11) {
    STATE.dmgStack+=10;
    res={icon:'⚔️',name:'力量觉醒',desc:'伤害叠加+10',rarity:'rare'};
  } else if (x===12) {
    if (STATE.bagSize+5<=700) { STATE.bagSize+=5; res={icon:'🎒',name:'背包扩容',desc:'背包+5格',rarity:'rare'}; }
    else { const g=(Math.floor(Math.random()*8)+6)*5; STATE.gold+=g; res={icon:'🪙',name:`${g} 金币`,desc:'背包满级补偿',rarity:'common'}; }
  } else {
    if (STATE.equipBag.length>=30) {
      STATE.gold+=100;
      res={icon:'🪙',name:'100 金币',desc:'仓库已满补偿',rarity:'common'};
    } else {
      const slot = ['weapon','armor','ring'][Math.floor(Math.random()*3)];
      const rarityRoll = Math.random();
      const rarity = rarityRoll<0.5?'common':rarityRoll<0.8?'rare':rarityRoll<0.95?'epic':'legendary';
      const eq = generateEquip(slot, rarity, Math.max(1, STATE.abyssFloor, STATE.lvl));
      STATE.equipBag.push(eq);
      if (rarity==='legendary') STATE.stats.legendaryPulled = (STATE.stats.legendaryPulled||0)+1;
      res={icon:'⚔️',name:eq.name,desc:`${RARITY_NAMES[rarity]}${EQUIP_SLOTS[slot]}`,rarity};
    }
  }
  if (forceEpic||pity) STATE.pity = 0;
  else if (res.rarity==='epic'||res.rarity==='legendary') STATE.pity = 0;
  else STATE.pity++;
  updateUI();
  checkAchievements();
  return res;
}

function addItem(id) {
  if (STATE.top>STATE.bagSize) return false;
  STATE.bag[STATE.top] = id;
  STATE.top++;
  if (ITEM_CODEX_LIST.includes(id)) STATE.codex.items[id] = true;
  return true;
}

  log('⚒️ 铁匠铺。深渊魔物会掉落陨铁。','sys');
}

// ==================== 升级/天赋 ====================
function openUpgrade() {
  setActions([
    { text:`强化武器 (需${(STATE.weaponLv+1)*50}G)`, cls:"primary", onClick:upgradeWeapon },
    { text:`🌳 天赋树 (剩余${STATE.talentPoints}点)`, cls:"purple", onClick:openTalentTree },
    { text:`蓄力一击(${(STATE.skillLv[1]+1)*5}G)`, onClick:()=>upSkill(1,5) },
    { text:`回击(${(STATE.skillLv[2]+1)*6}G)`, onClick:()=>upSkill(2,6) },
    { text:`背包扩容(${(STATE.bagSize-10)*10+5}G)`, onClick:upBag },
    { text:"返回城镇", onClick:openCity }
  ]);
}
function upgradeWeapon() {
  const cost = (STATE.weaponLv+1)*50;
  if (STATE.gold>=cost) {
    STATE.gold-=cost; STATE.weaponLv++;
    log(`武器强化成功！额外伤害 +${STATE.weaponLv*5}`,'heal');
    SFX.play('levelup'); updateUI();
  } else log('金币不够！','dmg');
  openUpgrade();
}

// ==================== 战斗 ====================
function rollAffixes(floor) {
  const count = floor>=10?2:(floor>=5?1:(Math.random()<0.3?1:0));
  const pool = Object.keys(AFFIX_DEF);
  const result = [];
  for (let i=0;i<count&&pool.length;i++) {
    const idx = Math.floor(Math.random()*pool.length);
    result.push(pool.splice(idx,1)[0]);
  }
  return result;
}
function registerMonster(name) {
  const base = name.split(' (')[0];
  const key = MONSTER_CODEX.find(m=>name.includes(m)) || base;
  STATE.codex.monsters[key] = (STATE.codex.monsters[key]||0)+1;
}
function startRandomBattle() {
  setActions([]);
  STATE.inAbyss = false;
  STATE.playerStatus = [];
  playerDefending = false;
  const roll = Math.floor(Math.random()*4);
  const lvl = Math.floor(Math.random()*3)+1;
  let emoji='',name='',hp=0,atk=0,anim='anim-float';
  if (roll===0) { emoji='🟢'; name='弹簧怪'; hp=20+lvl*20+STATE.lvl*5; atk=11+STATE.lvl*3; anim='anim-bounce'; }
  else if (roll===1) { emoji='🟩'; name='史莱姆'; hp=30+lvl*25+STATE.lvl*5; atk=11+STATE.lvl*3; }
  else if (roll===2) { emoji='💀'; name='骷髅兵'; hp=40+lvl*25+STATE.lvl*5; atk=16+STATE.lvl*3; }
  else { emoji='🧙‍♂️'; name='巫师'; hp=35+lvl*30+STATE.lvl*5; atk=18+STATE.lvl*3; }
  STATE.enemy = { name:`${name} (Lv${lvl})`, hp, maxHp:hp, atk, status:[], affixes:[], turnCount:0 };
  enemyEmoji.textContent = emoji;
  enemyEmoji.className = `char-emoji ${anim}`;
  enemyBox.style.display = 'flex';
  vsText.textContent = '⚔️';
  registerMonster(name);
  const shieldLv = STATE.talentTree.shield||0;
  if (shieldLv>0) addStatus(STATE.playerStatus, 'shield', shieldLv*10, 99);
  const eq = getEquipStats();
  if (eq.spRegen>0) STATE.sp += eq.spRegen;
  updateUI();
  log(`遭遇了 ${STATE.enemy.name}！`,'dmg');
  battleLoop();
}
function startAbyss() {
  setActions([]);
  STATE.inAbyss = true;
  STATE.playerStatus = [];
  playerDefending = false;
  STATE.abyssFloor++;
  STATE.stats.abyssBest = Math.max(STATE.stats.abyssBest||0, STATE.abyssFloor);
  const isElite = STATE.abyssFloor%5===0;
  const mul = 1+STATE.abyssFloor*0.5;
  let emoji = isElite?'👺':'👾';
  let name = isElite?'深渊领主':'深渊魔物';
  let hp = Math.floor((isElite?500:200)*mul);
  let atk = Math.floor((isElite?50:30)*mul);
  let affixes = rollAffixes(STATE.abyssFloor);
  if (STATE.abyssFloor===20) {
    emoji='🐲'; name='深渊终焉·灭世魔龙'; hp=15000; atk=200; affixes=[];
  }
  STATE.enemy = { name:`${name} (深渊 ${STATE.abyssFloor} 层)`, hp, maxHp:hp, atk, isElite, isFinalBoss:STATE.abyssFloor===20, status:[], affixes, turnCount:0 };
  enemyEmoji.textContent = emoji;
  enemyEmoji.className = 'char-emoji anim-bounce';
  enemyBox.style.display = 'flex';
  vsText.textContent = '🔥';
  registerMonster(name);
  const shieldLv = STATE.talentTree.shield||0;
  if (shieldLv>0) addStatus(STATE.playerStatus, 'shield', shieldLv*10, 99);
  const eq = getEquipStats();
  if (eq.spRegen>0) STATE.sp += eq.spRegen;
  updateUI();
  updateQuestProgress('abyss', STATE.abyssFloor);
  if (STATE.abyssFloor===20) log('【终极决战】灭世魔龙！','crit');
  else log(`进入深渊第 ${STATE.abyssFloor} 层！遭遇了 ${STATE.enemy.name}${affixes.length?' ['+affixes.map(a=>AFFIX_DEF[a].name).join(',')+']':''}`,'dmg');
  battleLoop();
}
function battleLoop() {
  if (!STATE.enemy) return;
  if (STATE.enemy.hp<=0) { winBattle(); return; }
  if (STATE.hp<=0) { loseBattle(); return; }
  const dot = tickDot(STATE.playerStatus, STATE.maxHp);
  if (dot>0) {
    STATE.hp -= dot;
    log(`持续伤害生效，损失 ${dot} 点血量。`,'dmg');
    playHitAnim(document.getElementById('playerBox'), dot);
    updateUI();
    if (STATE.hp<=0) { loseBattle(); return; }
  }
  if (hasStun(STATE.playerStatus)) {
    consumeStun(STATE.playerStatus);
    log('你被眩晕了，无法行动！','dmg');
    SFX.play('stun');
    updateUI();
    setTimeout(enemyTurn, 800);
    return;
  }
  showBattleActions();
}
function showBattleActions() {
  if (!STATE.enemy||STATE.enemy.hp<=0) return;
  const btns = [
    { text:"普通攻击 (1)", cls:"primary", onClick:playerAttack },
    { text:"使用技能 (2)", onClick:useSkillsMenu },
    { text:"防御 (4)", cls:"blue", onClick:playerDefend },
    { text:"打开背包 (3)", onClick:()=>openBag(true, showBattleActions) }
  ];
  if (STATE.inAbyss) {
    btns.push({ text:"撤退(清空层数)", cls:"danger", onClick:()=>{
      log('你逃离了深渊，层数清零。','dmg');
      STATE.inAbyss = false; STATE.abyssFloor = 0;
      STATE.enemy = null; enemyBox.style.display = 'none'; vsText.textContent = 'VS';
      STATE.playerStatus = [];
      startGame();
    }});
  }
  setActions(btns);
}
function playerDefend() {
  playerDefending = true;
  STATE.sp += 5;
  const shieldVal = 15+STATE.lvl*2;
  addStatus(STATE.playerStatus, 'shield', shieldVal, 99);
  SFX.play('shield');
  log(`你进入防御姿态：伤害减半，获得 ${shieldVal} 点护盾，技能点+5。`,'heal');
  updateUI();
  setTimeout(enemyTurn, 500);
}
function calcPlayerDamage(base) {
  const eq = getEquipStats();
  let dmg = base + STATE.dmgStack + STATE.weaponLv*5 + eq.atk;
  const critRate = eq.crit;
  const isCrit = Math.random()<critRate;
  if (isCrit) dmg *= getCritMultiplier();
  const execLv = STATE.talentTree.execute||0;
  if (execLv>0 && STATE.enemy.hp < STATE.enemy.maxHp*0.3) dmg *= (1+execLv*0.1);
  if ((STATE.enemy.affixes||[]).includes('tough')) dmg *= 0.8;
  return { dmg: Math.round(dmg), isCrit };
}
function dealDamageToEnemy(dmg, isCrit, label) {
  STATE.enemy.hp -= dmg;
  STATE.stats.totalDamage = (STATE.stats.totalDamage||0)+dmg;
  if (dmg > (STATE.stats.maxHit||0)) STATE.stats.maxHit = dmg;
  updateQuestProgress('damage', dmg);
  if (isCrit) log(`【暴击！】${label} 造成 ${dmg} 点伤害`,'crit');
  else log(`${label} 造成 ${dmg} 点伤害`,'atk');
  playHitAnim(enemyBox, dmg, isCrit);
  if ((STATE.enemy.affixes||[]).includes('thorns')) {
    const reflect = Math.floor(dmg*0.2);
    STATE.hp -= reflect;
    log(`反伤！你受到 ${reflect} 点伤害。`,'dmg');
    updateUI();
  }
}
function playerAttack() {
  SFX.play('swing');
  const base = Math.floor(Math.random()*11)+1+STATE.lvl*(Math.floor(Math.random()*2)+1);
  const { dmg, isCrit } = calcPlayerDamage(base);
  setTimeout(()=>dealDamageToEnemy(dmg, isCrit, '你'), 100);
  const eq = getEquipStats();
  if (eq.lifesteal>0) {
    const heal = Math.floor(dmg*eq.lifesteal);
    STATE.hp = Math.min(STATE.maxHp, STATE.hp+heal);
    log(`吸血：回复 ${heal} 点血量`,'heal');
    setTimeout(()=>playHealAnim(heal), 200);
  }
  updateUI();
  checkAchievements();
  setTimeout(enemyTurn, 500);
}
function enemyTurn() {
  if (!STATE.enemy) return;
  if (STATE.enemy.hp<=0) { winBattle(); return; }
  if (STATE.enemy.status&&STATE.enemy.status.length) {
    const dot = tickDot(STATE.enemy.status, STATE.enemy.maxHp);
    if (dot>0) {
      STATE.enemy.hp -= dot;
      log(`${STATE.enemy.name} 受到持续伤害，损失 ${dot} 点。`,'atk');
      playHitAnim(enemyBox, dot);
      updateUI();
      if (STATE.enemy.hp<=0) { winBattle(); return; }
    }
  }
  const e = STATE.enemy;
  e.turnCount = (e.turnCount||0)+1;
  if (e.isFinalBoss && e.turnCount%3===0) {
    log('🐲 魔龙开始蓄力，下回合将释放毁灭一击！防御或护盾可抵挡。','crit');
    e.charging = true;
    updateUI();
    setTimeout(battleLoop, 800);
    return;
  }
  let dmg = e.atk+Math.floor(Math.random()*10);
  let label = `${e.name} 造成了 ${dmg} 点伤害`;
  if ((e.affixes||[]).includes('berserk') && e.hp<e.maxHp*0.3) {
    dmg *= 2;
    label = `${e.name}（狂暴）造成 ${dmg} 点伤害`;
  }
  if (e.charging) {
    e.charging = false;
    dmg *= 3;
    label = `🐲 毁灭一击！${dmg} 点伤害`;
  }
  if (playerDefending) {
    dmg = Math.ceil(dmg/2);
    playerDefending = false;
    log('你挡住了大部分伤害！','heal');
  }
  const reduction = getPlayerDamageReduction();
  dmg = Math.round(dmg*(1-reduction));
  dmg = absorbShield(STATE.playerStatus, dmg);
  if (dmg<0) dmg = 0;
  STATE.hp -= dmg;
  playHitAnim(document.getElementById('playerBox'), dmg);
  log(label.replace(/\d+ 点伤害$/, `${dmg} 点伤害`),'dmg');
  if ((e.affixes||[]).includes('vampiric')) {
    const heal = Math.floor(dmg*0.3);
    e.hp = Math.min(e.maxHp, e.hp+heal);
    log(`${e.name} 吸取了 ${heal} 点血量。`,'dmg');
  }
  applyEnemyDebuff();
  updateUI();
  setTimeout(battleLoop, 500);
}
function applyEnemyDebuff() {
  const e = STATE.enemy;
  if (!e) return;
  if (e.isFinalBoss) {
    addStatus(STATE.playerStatus, 'burn', 30, 3);
    log('魔龙的烈焰灼烧着你！','dmg');
    if (Math.random()<0.2) { addStatus(STATE.playerStatus,'stun',0,1); log('你被龙威震慑，眩晕！','dmg'); }
    return;
  }
  if (e.name.includes('巫师') && Math.random()<0.35) {
    addStatus(STATE.playerStatus,'poison',0,3);
    log('巫师对你施放了剧毒！','dmg');
  }
  if (e.isElite && Math.random()<0.25) {
    addStatus(STATE.playerStatus,'stun',0,1);
    log('深渊领主的攻击让你眩晕了！','dmg');
  }
}
function winBattle() {
  tickLoan();
  const interestRate = 0.02+(STATE.talentTree.interest||0)*0.005;
  if (STATE.bankGold>0) {
    const interest = Math.floor(STATE.bankGold*interestRate);
    if (interest>0) {
      STATE.bankGold += interest;
      log(`【银行结算】存款利息 +${interest} 金币！`,'sys');
    }
  }
  const ironChance = 0.3+(STATE.talentTree.iron||0)*0.05;
  if (Math.random()<ironChance) {
    STATE.ironOre++;
    log('拾取到了1个【陨铁】！','reward');
  }
  STATE.stats.kills = (STATE.stats.kills||0)+1;
  updateQuestProgress('kill', 1);
  checkAchievements();
  if (STATE.inAbyss) {
    if (STATE.enemy.isFinalBoss && !STATE.hasWon) {
      STATE.hasWon = true;
      SFX.play('victory');
      document.getElementById('victoryModal').classList.add('show');
      return;
    }
    let reward = Math.floor(50*(1+STATE.abyssFloor*0.2));
    const goldBonus = getEquipStats().goldBonus + (STATE.talentTree.gold||0)*0.1;
    reward = Math.floor(reward*(1+goldBonus));
    STATE.gold += reward;
    log(`击杀深渊怪物！获得 ${reward} 金币。`,'reward');
    SFX.play('coin');
    if (STATE.enemy.isElite && STATE.equipBag.length<30 && Math.random()<0.6) {
      const slot = ['weapon','armor','ring'][Math.floor(Math.random()*3)];
      const rarity = Math.random()<0.5?'rare':Math.random()<0.8?'epic':'legendary';
      const eq = generateEquip(slot, rarity, Math.max(1, STATE.abyssFloor));
      STATE.equipBag.push(eq);
      log(`精英掉落装备：[${eq.name}]（${RARITY_NAMES[rarity]}）`,'reward');
    }
    if (STATE.enemy.isElite) {
      STATE.talentPoints++;
      STATE.maxHp += 50; STATE.hp += 50;
      log('精英奖励：天赋点+1，血量上限+50！','reward');
      setTimeout(()=>SFX.play('levelup'), 200);
    }
    enemyEmoji.textContent = '💥';
    setTimeout(()=>{
      STATE.enemy = null; enemyBox.style.display = 'none'; updateUI();
      startAbyss();
    }, 1000);
    return;
  }
  let reward = Math.floor(Math.random()*41)+31+STATE.lvl*(Math.floor(Math.random()*6)+1)+15;
  const goldBonus = getEquipStats().goldBonus + (STATE.talentTree.gold||0)*0.1;
  reward = Math.floor(reward*(1+goldBonus));
  STATE.gold += reward;
  STATE.lvl++;
  STATE.talentPoints++;
  updateUI();
  log(`击杀 ${STATE.enemy.name}！获得 ${reward} 金币。`,'reward');
  log(`等级提升！当前等级: ${STATE.lvl}，获得1天赋点`,'heal');
  SFX.play('coin'); setTimeout(()=>SFX.play('levelup'), 300);
  enemyEmoji.textContent = '💥';
  setTimeout(()=>{
    STATE.enemy = null; enemyBox.style.display = 'none'; vsText.textContent = 'VS';
    startGame();
  }, 1200);
}
function loseBattle() {
  if (STATE.reviveCoins>0) {
    STATE.reviveCoins--;
    STATE.hp = STATE.maxHp;
    STATE.sp += Math.floor(Math.random()*301)+50;
    STATE.playerStatus = [];
    updateUI();
    log('复活币已使用，血量回满！','heal');
    SFX.play('heal');
    setTimeout(battleLoop, 1000);
  } else {
    log('你被击败了...','dmg');
    SFX.play('fail');
    if (STATE.inAbyss) {
      log('深渊挑战失败，层数清零。','dmg');
      STATE.inAbyss = false; STATE.abyssFloor = 0;
    }
    STATE.playerStatus = [];
    setActions([{ text:"回主菜单", cls:"danger", onClick:showMainMenu }]);
  }
}

// ==================== 技能 ====================
function useSkillsMenu() {
  setActions([]);
  const btns = [];
  if (STATE.skills[1]) btns.push({ text:'蓄力一击(10SP)', onClick:()=>useSkill(1) });
  if (STATE.skills[2]) btns.push({ text:'回击(20SP)', onClick:()=>useSkill(2) });
  if (STATE.skills[3]) btns.push({ text:'逃跑(30SP)', onClick:()=>useSkill(3) });
  if (STATE.skills[4]) btns.push({ text:'吸血(35SP)', onClick:()=>useSkill(4) });
  btns.push({ text:'返回', onClick:showBattleActions });
  setActions(btns);
}
function useSkill(type) {
  let dmg = 0;
  if (type===1 && STATE.sp>=10) {
    STATE.sp -= 10;
    const base = Math.floor(Math.random()*31)+21+STATE.lvl*(Math.floor(Math.random()*2)+1);
    const r = calcPlayerDamage(base);
    dmg = r.dmg;
    dealDamageToEnemy(dmg, r.isCrit, '蓄力一击');
    const burnChance = 0.2+STATE.skillLv[1]*0.03;
    if (Math.random()<burnChance) {
      const burnDmg = 15+STATE.lvl*2+STATE.skillLv[1]*2;
      addStatus(STATE.enemy.status,'burn',burnDmg,3);
      log(`引发灼烧！每回合 ${burnDmg} 伤害，持续3回合。`,'dmg');
    }
  } else if (type===2 && STATE.sp>=20) {
    STATE.sp -= 20;
    const base = Math.max(0, Math.floor(Math.random()*11)+1+STATE.lvl*(Math.floor(Math.random()*2)+1)-5);
    const r = calcPlayerDamage(base);
    dealDamageToEnemy(r.dmg, r.isCrit, '回击');
  } else if (type===3 && STATE.sp>=30) {
    STATE.sp -= 30;
    log('成功逃跑！','heal');
    if (STATE.inAbyss) { STATE.inAbyss=false; STATE.abyssFloor=0; log('你逃离了深渊，层数清零。','dmg'); }
    STATE.enemy = null; STATE.playerStatus = [];
    enemyBox.style.display = 'none'; vsText.textContent = 'VS';
    updateUI();
    setTimeout(startGame, 800);
    return;
  } else if (type===4 && STATE.sp>=35) {
    STATE.sp -= 35;
    const base = Math.floor(Math.random()*11)+1+STATE.lvl*(Math.floor(Math.random()*2)+1);
    const r = calcPlayerDamage(base);
    dealDamageToEnemy(r.dmg, r.isCrit, '吸血');
    const heal = Math.floor(r.dmg/2);
    STATE.hp = Math.min(STATE.maxHp, STATE.hp+heal);
    log(`吸血回复 ${heal} 点血量`,'heal');
    SFX.play('drain');
  } else {
    log('技能点不够！','dmg');
    setTimeout(showBattleActions, 500);
    return;
  }
  updateUI(); checkAchievements();
  setTimeout(enemyTurn, 500);
}

// ==================== 背包 ====================
function openBag(inBattle=false, onReturn=null) {
  bagReturn = onReturn || (inBattle?showBattleActions:startGame);
  const list = document.getElementById('bagList');
  list.innerHTML = '';
  for (let i=1;i<=STATE.bagSize;i++) {
    const item = STATE.bag[i];
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.textContent = `${i}: ${ITEM_NAMES[item]||'未知'}`;
    if (item===ITEMS.EMPTY) btn.style.opacity = '0.4';
    btn.onclick = ()=>{ SFX.play('click'); useItem(i); };
    list.appendChild(btn);
  }
  document.getElementById('bagModal').classList.add('show');
}
function closeBag() {
  closeModal('bagModal');
  const fn = bagReturn; bagReturn = null;
  if (fn) fn();
}
function useItem(slot) {
  const item = STATE.bag[slot];
  if (item===ITEMS.EMPTY) { log('这个格子是空的。','sys'); return; }
  if (item===ITEMS.HEAL) {
    if (STATE.hp>=STATE.maxHp) { log('血量已满。','sys'); return; }
    STATE.hp = Math.min(STATE.maxHp, STATE.hp+20);
    removeItem(slot);
    log('恢复20点血量','heal'); playHealAnim(20);
  } else if (item===ITEMS.ATTACK) {
    STATE.dmgStack += 10; removeItem(slot);
    log('伤害叠加+10','heal'); SFX.play('buy');
  } else if (item===ITEMS.PILL) {
    STATE.sp += 10; removeItem(slot);
    log('技能点+10','heal'); SFX.play('buy');
  } else if (item>=101&&item<=104) {
    const id = item-100;
    if (!STATE.skills[id]) { STATE.skills[id]=1; log(`学会新技能：[${ITEM_NAMES[item]}]`,'heal'); }
    else log(`已掌握 [${ITEM_NAMES[item]}]，物品已消耗。`,'sys');
    removeItem(slot); SFX.play('buy');
  }
  updateUI();
  closeBag();
}
function removeItem(slot) {
  for (let i=slot;i<STATE.top;i++) STATE.bag[i] = STATE.bag[i+1];
  STATE.top--;
}

// ==================== 商店 ====================
function applyDiscount(price) {
  const d = Math.min(0.3, (STATE.talentTree.discount||0)*0.03);
  return Math.max(1, Math.floor(price*(1-d)));
}
function openShop() {

    { text:`逃跑(${applyDiscount(100)}G)`, onClick:()=>buySkill(3, applyDiscount(100), ITEMS.SK_ESCAPE) },
    { text:`吸血(${applyDiscount(200)}G)`, onClick:()=>buySkill(4, applyDiscount(200), ITEMS.SK_DRAIN) },
    { text:`生命之泉(${applyDiscount(250)}G)`, onClick:()=>buyMaxHp(applyDiscount(250)) },
    { text:`技能药片(${applyDiscount(25)}G)`, onClick:()=>buy(8, applyDiscount(25), ITEMS.PILL) },
    { text:`复活币(${applyDiscount(500)}G)`, onClick:()=>buyRevive(applyDiscount(500)) },
    { text:"返回城镇", onClick:openCity }
  ]);
}
function buy(id, price, itemId) {
  if (STATE.gold>=price && STATE.top<=STATE.bagSize) {
    STATE.gold -= price; STATE.bag[STATE.top] = itemId; STATE.top++;
    if (ITEM_CODEX_LIST.includes(itemId)) STATE.codex.items[itemId] = true;
    log('购买成功！','heal'); SFX.play('buy'); updateUI();
  } else if (STATE.gold<price) log('金币不够！','dmg');
  else log('背包已满！','dmg');
  openShop();
}
function buySkill(id, price, itemId) {
  if (STATE.skills[id]===1) { log('已拥有该技能','sys'); openShop(); return; }
  if (STATE.gold>=price && STATE.top<=STATE.bagSize) {
    STATE.gold -= price; STATE.skills[id] = 1;
    STATE.bag[STATE.top] = itemId; STATE.top++;
    if (ITEM_CODEX_LIST.includes(itemId)) STATE.codex.items[itemId] = true;
    log('购买成功！','heal'); SFX.play('buy'); updateUI();
  } else if (STATE.gold<price) log('金币不够！','dmg');
  else log('背包已满！','dmg');
  openShop();
}
function buyMaxHp(price) {
  if (STATE.gold>=price) {
    STATE.gold-=price; STATE.maxHp+=40; STATE.hp+=40;
    log('血量上限提升40！','heal'); SFX.play('buy'); updateUI();
  } else log('金币不够！','dmg');
  openShop();
}
function buyRevive(price) {
  if (STATE.gold>=price) {
    STATE.gold-=price; STATE.reviveCoins++;
    log('购买成功！','heal'); SFX.play('buy'); updateUI();
  } else log('金币不够！','dmg');
  openShop();
}
function upSkill(id, baseCost) {
  if (STATE.skills[id]===0) { log('未拥有该技能','dmg'); openUpgrade(); return; }
  if (STATE.skillLv[id]>=10) { log('已满级10','sys'); openUpgrade(); return; }
  const cost = (STATE.skillLv[id]+1)*baseCost;
  if (STATE.gold>=cost) {
    STATE.gold-=cost; STATE.skillLv[id]++;
    log(`升级成功！等级 ${STATE.skillLv[id]}`,'heal'); SFX.play('levelup'); updateUI();
  } else log('金币不够','dmg');
  openUpgrade();
}
function upBag() {
  if (STATE.bagSize+5<=700) {
    const cost = (STATE.bagSize-10)*10+5;
    if (STATE.gold>=cost) {
      STATE.gold-=cost; STATE.bagSize+=5;
      log(`背包升级！大小 ${STATE.bagSize}`,'heal'); SFX.play('levelup'); updateUI();
    } else log('金币不够','dmg');
  } else log('背包已达上限','sys');
  openUpgrade();
}

// ==================== 贷款 ====================
function openLoan() {
  setActions([
    { text:"查看状态", onClick:()=>{
      if (STATE.loan.active) log(`欠款:${STATE.loan.amount}，剩余:${STATE.loan.days} 场战斗后到期`,'sys');
      else log('当前没有贷款。','sys');
      openLoan();
    }},
    { text:"贷款200(15场后到期)", onClick:()=>takeLoan(200,15) },
    { text:"还款", onClick:repayLoan },
    { text:"返回银行", onClick:openBank }
  ]);
}
function takeLoan(amt, days) {
  if (STATE.loan.active) { log('已有未还清贷款','dmg'); openLoan(); return; }
  STATE.loan = { active:true, amount:amt, days };
  STATE.gold += amt;
  updateUI();
  log(`成功贷款 ${amt} 金币，${days} 场战斗后到期。`,'reward'); SFX.play('coin');
  openLoan();
}
function repayLoan() {
  if (!STATE.loan.active) { log('无需还款','sys'); openLoan(); return; }
  if (STATE.gold<STATE.loan.amount) { log('金币不足!','dmg'); openLoan(); return; }
  STATE.gold -= STATE.loan.amount;
  STATE.loan = { active:false, amount:0, days:0 };
  updateUI();
  log('已还清贷款','heal'); SFX.play('coin');
  openLoan();
}
function tickLoan() {
  if (!STATE.loan.active) return;
  STATE.loan.days--;
  if (STATE.loan.days<=0) {
    log('⚠️ 贷款到期！银行开始追债……','dmg');
    if (STATE.bankGold>=STATE.loan.amount) {
      STATE.bankGold -= STATE.loan.amount;
      log(`银行从存款中扣除 ${STATE.loan.amount} 金币。`,'dmg');
    } else if (STATE.gold>=STATE.loan.amount) {
      STATE.gold -= STATE.loan.amount;
      log(`你被迫支付了 ${STATE.loan.amount} 金币。`,'dmg');
    } else {
      const p = Math.floor(STATE.maxHp*0.3);
      STATE.hp -= p;
      log(`银行打手将你打成重伤，损失 ${p} 点血量！`,'dmg');
      SFX.play('hurt');
    }
    STATE.loan = { active:false, amount:0, days:0 };
    SFX.play('alarm');
  } else if (STATE.loan.days<=3) {
    log(`⚠️ 贷款即将到期，剩余 ${STATE.loan.days} 场战斗！`,'dmg');
  }
}

// ==================== 存档 ====================
function applySave(data) {
  const def = defaultState();
  Object.keys(def).forEach(k=>{
    if (data[k]===undefined || (data[k]===null && k!=='enemy')) data[k] = def[k];
  });
  if (!Array.isArray(data.bag)) data.bag = def.bag;
  if (!Array.isArray(data.diejiaCache)) data.diejiaCache = def.diejiaCache;
  if (!Array.isArray(data.playerStatus)) data.playerStatus = [];
  if (!Array.isArray(data.equipBag)) data.equipBag = [];
  if (!Array.isArray(data.quests)) data.quests = [];
  if (!data.equipment || typeof data.equipment!=='object') data.equipment = def.equipment;
  else data.equipment = Object.assign({}, def.equipment, data.equipment);
  if (!data.talentTree || typeof data.talentTree!=='object') data.talentTree = def.talentTree;
  else data.talentTree = Object.assign({}, def.talentTree, data.talentTree);
  if (!data.stats || typeof data.stats!=='object') data.stats = def.stats;
  else data.stats = Object.assign({}, def.stats, data.stats);
  if (!data.achievements || typeof data.achievements!=='object') data.achievements = {};
  if (!data.codex || typeof data.codex!=='object') data.codex = { monsters:{}, items:{} };
  if (!data.codex.monsters) data.codex.monsters = {};
  if (!data.codex.items) data.codex.items = {};
  if (!data.skills || typeof data.skills!=='object') data.skills = def.skills;
  if (!data.skillLv || typeof data.skillLv!=='object') data.skillLv = def.skillLv;
  if (!data.loan || typeof data.loan!=='object') data.loan = def.loan;
  else data.loan = Object.assign({}, def.loan, data.loan);
  if (typeof data.pity!=='number') data.pity = 0;
  data.enemy = null;
  Object.assign(STATE, data);
  if (!STATE.quests.length) initQuests();
}

function getSaveList() {
  const saves = [];
  for (let i=0;i<localStorage.length;i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('oj_game_save_')) saves.push(key.replace('oj_game_save_',''));
  }
  return saves;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function saveGame(onDone) {
  const name = prompt('请输入存档名称 (同名将覆盖):','城镇大亨');
  if (!name) { if (onDone) onDone(); return; }
  try {
    const data = JSON.parse(JSON.stringify(STATE));
    data.enemy = null;
    localStorage.setItem(`oj_game_save_${name}`, JSON.stringify(data));
    log(`游戏已保存至 [${name}]`,'heal');
    SFX.play('levelup');
  } catch(e) { log(`保存失败: ${e.message}`,'dmg'); }
  if (onDone) onDone();
}

function openSaveManager() {
  renderSaveList();
  document.getElementById('saveModal').classList.add('show');
}

function closeSaveManager() {
  closeModal('saveModal');
  showMainMenu();
}

function renderSaveList() {
  const list = document.getElementById('saveList');
  list.innerHTML = '';
  const saves = getSaveList();
  if (!saves.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">暂无存档</div>';
    return;
  }
  saves.forEach(name => {
    let meta = '存档损坏';
    try {
      const data = JSON.parse(localStorage.getItem(`oj_game_save_${name}`));
      const lv = data.lvl||0;
      const gold = data.gold||0;
      const abyss = data.abyssFloor||0;
      const saved = data.savedAt ? new Date(data.savedAt).toLocaleString() : '';
      meta = `Lv ${lv} · 金币 ${gold} · 深渊 ${abyss} 层${saved?` · ${saved}`:''}`;
    } catch(e) {}
    const div = document.createElement('div');
    div.className = 'save-item';
    div.innerHTML = `
      <div style="flex:1;min-width:0;">
        <div class="save-name">${escapeHtml(name)}</div>
        <div class="save-meta">${meta}</div>
      </div>
    `;
    const loadBtn = document.createElement('button');
    loadBtn.className = 'btn-mini';
    loadBtn.style.borderColor = 'var(--accent)';
    loadBtn.style.color = 'var(--accent)';
    loadBtn.textContent = '读取';
    loadBtn.onclick = () => loadSaveByName(name);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-mini';
    delBtn.style.borderColor = 'var(--danger)';
    delBtn.style.color = 'var(--danger)';
    delBtn.textContent = '删除';
    delBtn.onclick = () => deleteSaveByName(name);
    const wrap = document.createElement('div');
    wrap.className = 'save-actions';
    wrap.appendChild(loadBtn);
    wrap.appendChild(delBtn);
    div.appendChild(wrap);
    list.appendChild(div);
  });
}

function loadSaveByName(name) {
  try {
    const raw = localStorage.getItem(`oj_game_save_${name}`);
    if (!raw) { log(`存档 [${name}] 不存在或已被删除。`,'dmg'); renderSaveList(); return; }
    applySave(JSON.parse(raw));
    STATE.enemy = null; STATE.inAbyss = false;
    enemyBox.style.display = 'none'; vsText.textContent = 'VS';
    updateUI();
    log(`已读取存档 [${name}]`,'heal');
    SFX.play('buy');
    closeModal('saveModal');
    startGame();
  } catch(e) {
    log(`读取失败: ${e.message}`,'dmg');
  }
}

function deleteSaveByName(name) {
  if (!confirm(`确定要删除存档 [${name}] 吗？此操作不可恢复。`)) return;
  try {
    localStorage.removeItem(`oj_game_save_${name}`);
    log(`已删除存档 [${name}]`,'heal');
    SFX.play('click');
    renderSaveList();
  } catch(e) {
    log(`删除失败: ${e.message}`,'dmg');
  }
}

// ==================== 主流程 ====================
function continueEndless() {
  closeModal('victoryModal');
  log('【通关后】你选择继续留在深渊……','sys');
  STATE.gold += 5000;
  log('获得通关奖励：5000 金币！','reward');
  updateUI();
  startAbyss();
}

function showMainMenu() {
  STATE.enemy = null; STATE.inAbyss = false;
  enemyBox.style.display = 'none'; vsText.textContent = 'VS';
  setActions([
    { text:'开始新游戏', cls:'primary', onClick:startNewGame },
    { text:'存档管理', onClick:openSaveManager }
  ]);
}

function startNewGame() {
  Object.assign(STATE, defaultState());
  initQuests();
  updateUI();
  log('欢迎来到文字游戏世界！','sys');
  SFX.play('levelup');
  startGame();
}

function startGame() {
  STATE.enemy = null; STATE.inAbyss = false;
  enemyBox.style.display = 'none'; vsText.textContent = 'VS';
  updateUI();
  if (STATE.hp<=0) {
    log('你死了...','dmg');
    setActions([
      { text:'重生', cls:'danger', onClick:()=>{ STATE.hp=STATE.maxHp; updateUI(); startGame(); } },
      { text:'回主菜单', onClick:showMainMenu }
    ]);
    return;
  }
  const eq = getEquipStats();
  setActions([
    { text:'信息', onClick:()=>{
        log(`血量:${STATE.hp}/${STATE.maxHp} 金币:${STATE.gold} 技能点:${STATE.sp}`,'sys');
        log(`攻击加成:+${eq.atk} 防御:+${eq.def} 暴击:${(eq.crit*100).toFixed(1)}% 吸血:${(eq.lifesteal*100).toFixed(1)}%`,'sys');
        log(`武器强化:+${STATE.weaponLv} 伤害叠加:${STATE.dmgStack} 天赋点:${STATE.talentPoints}`,'sys');
        setTimeout(startGame, 1500);
      }
    },
    { text:'装备', onClick:openEquipPanel },
    { text:'背包', onClick:()=>openBag(false, startGame) },
    { text:'野外战斗', cls:'primary', onClick:startRandomBattle },
    { text:'无尽深渊', cls:'danger', onClick:startAbyss },
    { text:'🏙️ 城镇', cls:'gold', onClick:openCity },
    { text:'保存', onClick:()=>saveGame(startGame) },
    { text:'主菜单', onClick:showMainMenu }
  ]);
}

// ==================== 键盘 ====================
document.addEventListener('keydown', (e)=>{
  const openModal = document.querySelector('.modal.show');
  if (e.key==='Escape') {
    if (openModal) {
      if (openModal.id==='bagModal') closeBag();
      else if (openModal.id==='lotteryModal') closeLotteryModal();
      else if (openModal.id==='equipModal') closeEquipPanel();
      else if (openModal.id==='talentModal') closeTalentTree();
      else if (openModal.id==='questModal') closeQuestBoard();
      else if (openModal.id==='achModal') closeAchievementPanel();
      else if (openModal.id==='saveModal') closeSaveManager();
      else closeModal(openModal.id);
    }
    return;
  }
  if (openModal) return;
  if (!STATE.enemy || STATE.enemy.hp<=0) return;
  if (STATE.hp<=0) return;
  const map = { '1':'普通攻击','2':'使用技能','3':'打开背包','4':'防御' };
  const label = map[e.key];
  if (!label) return;
  const btns = Array.from(actionsEl.querySelectorAll('button'));
  const btn = btns.find(b=>b.textContent.startsWith(label));
  if (btn && !btn.disabled) btn.click();
});

document.getElementById('btnSpeed').onclick = ()=>{
  const btn = document.getElementById('btnSpeed');
  if (btn.textContent==='速度: 快') { btn.textContent='速度: 极快'; drawAnimInterval=40; }
  else { btn.textContent='速度: 快'; drawAnimInterval=80; }
};

window.onload = ()=>{
  initLotteryPool();
  initQuests();
  showMainMenu();
};
</script>
